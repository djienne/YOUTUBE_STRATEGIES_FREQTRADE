version: '3'
services:
  freqtrade:
    image: ft-donchain:2025.10
    # Build the project-specific 2025.10 image with the strategy dependencies.
    build:
      context: .
      dockerfile: "./Dockerfile.technical"
    restart: unless-stopped
    container_name: donchian
    volumes:
      - "./user_data:/freqtrade/user_data"
    # Publish the enabled container API (8080) on localhost port 3010.
    ports:
      - "127.0.0.1:3010:8080"
    deploy:
      resources:
        limits:
          cpus: '0.1'      # Limit to 10% of a single CPU core
          memory: '512M'   # Limit to 512MB of RAM
    # Default command used when running `docker compose up`
    command: >
      trade
      --logfile /freqtrade/user_data/logs/freqtrade.log
      --db-url sqlite:////freqtrade/user_data/tradesv3.sqlite
      --config /freqtrade/user_data/config.json
      --strategy donchian
